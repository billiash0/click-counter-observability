include:
  - signoz/deploy/docker/docker-compose.yaml

services:
  click-counter:
    build: ./app
    container_name: click-counter-app
    ports:
      - "5002:5002"
    networks:
      - signoz-net
    depends_on:
      - prometheus
      - otel-collector
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    container_name: click-counter-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - signoz-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

networks:
  signoz-net:
    driver: bridge

volumes:
  prometheus_data: